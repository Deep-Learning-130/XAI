[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbias"
version = "0.1.0"
description = "Detectability-aware dataset bias auditor: reports what each test could have found, not only what it found."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "statsmodels>=0.14",
]

[project.scripts]
dbias = "dbias.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: calibration sweeps; deselect with -m 'not slow'",
]
